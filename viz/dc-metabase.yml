services:
  metabase:
    image: docker.io/metabase/metabase:latest
    container_name: metabase
    ports: ['3000:3000']
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    volumes:
      - ./data:/data:Z
      - ./plugins:/home/plugins:Z,U
    environment:
      MB_PLUGINS_DIR: /home/plugins
